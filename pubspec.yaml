name: budgetwatch_kenya
description: "VisionTo empower every Kenyan with transparent, data-driven access to public finance information, enabling citizens to understand how public resources are collected, allocated, spent, and audited."
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/logos/
    - assets/fonts/
    - assets/animations/
    - assets/mockups/
